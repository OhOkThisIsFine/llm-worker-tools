name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' &&
        github.ref_name == github.event.repository.default_branch &&
        github.ref == 'refs/heads/main')
    # Publishing uses npm Trusted Publishing (OIDC). The `id-token: write`
    # permission lets `npm publish` authenticate via a short-lived OIDC token
    # and attach SLSA build provenance — no NPM_TOKEN secret is required.
    # Configure the package's trusted publisher on npmjs.com (package >
    # Settings > Trusted Publisher) to point at this repo + workflow.
    #
    # The `environment:` gate controls WHEN GitHub will mint that OIDC token:
    # it is inert until the named Environment is created in repo Settings >
    # Environments with required reviewers, after which the irreversible
    # publish pauses for approval before the token is issued.
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm test
      - run: npm publish --dry-run --access public
      - run: npm publish --access public
